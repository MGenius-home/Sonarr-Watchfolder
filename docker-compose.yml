version: "3"
services:
  sonarr:
    build: .
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - SONARR_WATCH_INTERVAL=5
    volumes:
      - ./config:/config
      - ./tv:/tv
      - ./watch:/watch
    ports:
      - 8990:8989
    restart: unless-stopped
